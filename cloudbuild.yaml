steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/workspace-api:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/workspace-api:latest', '.']

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/workspace-api:$SHORT_SHA']

  # Step 3: Push the 'latest' tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/workspace-api:latest']

  # Step 4: Automatically update GKE to use the new image
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/workspace-api'
      - 'workspace-api=gcr.io/$PROJECT_ID/workspace-api:$SHORT_SHA'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1'
      - 'CLOUDSDK_CONTAINER_CLUSTER=agent-workspace-cluster'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/workspace-api:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/workspace-api:latest'